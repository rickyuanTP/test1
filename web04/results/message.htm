<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>意見留言</title>
<style>
  body { margin: 8px; background: #FFFFFF; font-family: "Microsoft JhengHei", sans-serif; font-size: 16px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
  td { border: 1px solid #666600; padding: 6px; vertical-align: middle; }
  td.th { font-size: 32px; font-weight: bold; text-align: center; width: 150px; }
  td.td { width: 350px; }
  .t1 td { background: #FFDDDD; }
  .t2 td { background: #FFFF99; }
  h2 { margin: 0 0 8px 0; color: #666600; }
</style>
<script>
  function sendMsg() {
    alert("留言已送出，謝謝您的寶貴意見！");
  }
  function todayText() {
    var d = new Date();
    var mm = (d.getMonth() + 1 < 10 ? "0" : "") + (d.getMonth() + 1);
    var dd = (d.getDate() < 10 ? "0" : "") + d.getDate();
    return d.getFullYear() + "/" + mm + "/" + dd;
  }
</script>
</head>
<body>
<h2>意見留言</h2>

<table class="t1">
  <tr>
    <td class="th">姓名</td>
    <td class="td"><input type="text" name="name" size="20" maxlength="20"></td>
  </tr>
  <tr>
    <td class="th">電話</td>
    <td class="td"><input type="text" name="tel" size="20" maxlength="20"></td>
  </tr>
  <tr>
    <td class="th">E-mail</td>
    <td class="td"><input type="text" name="mail" size="30" maxlength="30"><br>
      <a href="mailto:service@test.labor.gov.tw">service@test.labor.gov.tw</a></td>
  </tr>
</table>

<table class="t2">
  <tr>
    <td class="th">留言日期</td>
    <td class="td"><input type="text" name="date" size="20" value="" readonly>
      <script>document.write(todayText());</script></td>
  </tr>
  <tr>
    <td class="th">留言內容</td>
    <td class="td"><textarea name="content" rows="5" cols="30"></textarea></td>
  </tr>
  <tr>
    <td colspan="2" style="text-align:center;">
      <input type="button" value="送出" onclick="sendMsg()">
      <input type="reset" value="重置">
    </td>
  </tr>
</table>
</body>
</html>
