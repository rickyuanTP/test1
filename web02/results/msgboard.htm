<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>訪客留言 - 運動廣場連結網</title>
<link rel="stylesheet" href="../others/content.css">
</head>
<body>
<marquee direction="left" scrollamount="4" style="display:block;width:100%;font-size:14px;">謝謝蒞臨本網站，請給予我們支持、鼓勵與建言。</marquee>
<p class="navpath">現在位置：首頁 &gt; 訪客留言</p>
<form name="msgform" method="post" action="#" onsubmit="alert('歡迎蒞臨本網站，您的寶貴意見我們會儘速處理與回覆，謝謝！'); this.reset(); return false;">
<table class="msgtable">
  <tr>
    <td class="lbl">姓名</td>
    <td class="val"><input type="text" name="username" size="20"></td>
  </tr>
  <tr>
    <td class="lbl">電子郵件</td>
    <td class="val"><input type="text" name="email" size="60"></td>
  </tr>
  <tr>
    <td class="lbl">性別</td>
    <td class="val">
      <label><input type="radio" name="gender" value="男" checked>男</label>
      <label><input type="radio" name="gender" value="女">女</label>
    </td>
  </tr>
  <tr>
    <td class="lbl">職業類別</td>
    <td class="val">
      <select name="job">
        <option value="">-----------請選擇職業類別-----------</option>
        <option value="1">現役軍人</option>
        <option value="2">專業人員</option>
        <option value="3">技術員及助理專業人員</option>
      </select>
    </td>
  </tr>
  <tr>
    <td class="lbl">留言內容</td>
    <td class="val"><textarea name="message" rows="10" cols="78"></textarea></td>
  </tr>
  <tr>
    <td class="lbl"></td>
    <td class="val">
      <input type="submit" value="送出">
      <input type="reset" value="重寫">
    </td>
  </tr>
</table>
</form>
</body>
</html>
