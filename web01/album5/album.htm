<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>蘭嶼賞魚去</title>
<style>
html, body { margin: 0; padding: 0; background: #FFFFCC; }
body { padding: 36px 0; text-align: center; font-family: "標楷體", "DFKai-SB", serif; }
#title { margin: 0 0 12px; font-size: 20px; font-weight: bold; color: #0000FF; text-decoration: underline; }
#photo { display: block; margin: 0 auto; width: 400px; height: 300px; border: 5px solid #0000FF; }
#thumbs { margin-top: 16px; font-size: 0; }
#thumbs img { width: 60px; height: 45px; margin: 0 4px; border: 3px solid #0000FF; cursor: pointer; vertical-align: middle; }
#thumbs img:hover { border-color: #00FFFF; }
</style>
</head>
<body>
<h2 id="title">蘭嶼賞魚去</h2>
<img id="photo" src="../images/0551.jpg" width="400" height="300" alt="蘭嶼賞魚去">
<div id="thumbs">
  <img src="../images/0551.jpg" alt="蘭嶼賞魚去 1" onclick="showPhoto(this)">
  <img src="../images/0552.jpg" alt="蘭嶼賞魚去 2" onclick="showPhoto(this)">
  <img src="../images/0553.jpg" alt="蘭嶼賞魚去 3" onclick="showPhoto(this)">
  <img src="../images/0554.jpg" alt="蘭嶼賞魚去 4" onclick="showPhoto(this)">
  <img src="../images/0555.jpg" alt="蘭嶼賞魚去 5" onclick="showPhoto(this)">
</div>
<script>
function showPhoto(thumb) {
  document.getElementById('photo').src = thumb.src;
}
</script>
</body>
</html>
